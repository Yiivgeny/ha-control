[project]
name = "ha-control"
version = "0.2.1"
description = "Compact generic Home Assistant control plane for MCP and HA LLM API"
requires-python = ">=3.12"
dependencies = ["mcp==2.0.0", "aiohttp>=3.12,<4", "uvicorn>=0.34,<1", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["addon"]
include = ["ha_control*"]

[tool.setuptools.package-data]
ha_control = ["*.json"]
